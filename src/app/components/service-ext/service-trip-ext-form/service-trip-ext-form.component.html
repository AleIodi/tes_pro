<form #f4nsForm="ngForm" [formGroup]="formGroup">
  <div style="display: flex; flex-direction: column;">

    <div style="flex: 1;">
      <app-form-field [type]="'autocomplete'" [label]="'Utenti'" [name]="'user'" [formField]="formGroupObj.user" [autocompleteObj]="userAutocompleteObj" style="flex: 1;"></app-form-field>
    </div>

    <div style="flex: 1;">
      <app-form-field [type]="'autocomplete'" [label]="'Destinazione'" [name]="'destination'" [formField]="formGroupObj.destination" [autocompleteObj]="destinationAutocompleteObj" style="flex: 1;"></app-form-field>
    </div>

    <mat-divider></mat-divider>

    <div style="flex: 1; display: flex; flex-direction: row;">
      <div style="width: 30%;">
        <div style="padding-right: 2px; padding-left: 2px;">
          <app-form-field [type]="'date'" [label]="'Data Inizio'" [name]="'dateStart'" [formField]="formGroupObj.dateStart" style="flex: 1;"></app-form-field>
        </div>
      </div>

      <div style="width: 20%;">
        <div style="padding-right: 2px; padding-left: 2px;">
          <app-form-field [type]="'time'" [label]="'Ora Inizio'" [name]="'timeStart'" [formField]="formGroupObj.timeStart" (focusout)="fixStartEndTime(true)" style="flex: 1;"></app-form-field>
        </div>
      </div>

      <div style="width: 20%;">
        <div style="padding-right: 2px; padding-left: 2px;">
          <app-form-field [type]="'time'" [label]="'Ora Fine'" [name]="'timeEnd'" [formField]="formGroupObj.timeEnd" (focusout)="fixStartEndTime(false)" style="flex: 1;"></app-form-field>
        </div>
      </div>

      <div style="width: 30%; display: flex; justify-content: center; align-items: center;">
        <div style="padding-right: 2px; padding-left: 2px;">
          <span style="font-size: 24px;">{{getDifferenceInMinutes()}} h</span>
        </div>
      </div>
    </div>

    <ng-container *ngIf="!serviceTask">
      <div style="flex: 1;">
        <app-form-field [type]="'autocomplete'" [label]="'Attività'" [name]="'serviceTask'" [formField]="formGroupObj.serviceTask" [autocompleteObj]="serviceTaskAutocompleteObj" style="flex: 1;"></app-form-field>
      </div>
    </ng-container>

    <div class="form-field-row">
      <app-form-field [type]="'text'" [label]="'Km Rapportino'" [name]="'kmInvoice'" [formField]="formGroupObj.kmInvoice" style="flex: 1;"></app-form-field>
      <app-form-field [type]="'text'" [label]="'Km Reali'" [name]="'kmReal'" [formField]="formGroupObj.kmReal" style="flex: 1;"></app-form-field>
    </div>

    <div class="form-button-group" style="flex: 1;">
      <button mat-raised-button color="f4ns-confirm" (click)="save()" [disabled]="this.confirmClicked || !f4nsForm.valid">
        Salva
      </button>

      <button mat-raised-button color="f4ns-action" style="margin-left: 10px;" (click)="dialogRef.close()">
        Annulla
      </button>

      <ng-container *ngIf="serviceTrip">
        <button mat-raised-button color="f4ns-cancel" matTooltip="Cancella" style="float: right;" (click)="delete()" [disabled]="!serviceTaskIsEditable">
          <mat-icon class="mdi mdi-delete-forever"></mat-icon>
        </button>
      </ng-container>
    </div>
  </div>
</form>
