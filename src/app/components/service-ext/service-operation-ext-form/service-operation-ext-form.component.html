<form #f4nsForm="ngForm" [formGroup]="formGroup">
  <div style="display: flex; flex-direction: column;">
    <div style="flex: 1; display: flex; flex-direction: row;">
      <div style="width: 30%;">
        <div style="padding-right: 2px; padding-left: 2px;">
          <app-form-field [type]="'date'" [label]="'Data Inizio'" [name]="'dateStart'" [formField]="formGroupObj.dateStart" style="flex: 1;"></app-form-field>
        </div>
      </div>

      <div style="width: 20%;">
        <div style="padding-right: 2px; padding-left: 2px;">
          <app-form-field [type]="'time'" [label]="'Ora Inizio'" [name]="'timeStart'" [formField]="formGroupObj.timeStart" (focusout)="fixStartEndTime(true)" style="flex: 1;"></app-form-field>
        </div>
      </div>

      <div style="width: 20%;">
        <div style="padding-right: 2px; padding-left: 2px;">
          <app-form-field [type]="'time'" [label]="'Ora Fine'" [name]="'timeEnd'" [formField]="formGroupObj.timeEnd" (focusout)="fixStartEndTime(false)" style="flex: 1;"></app-form-field>
        </div>
      </div>

      <div style="width: 30%; display: flex; justify-content: center; align-items: center;">
        <div style="padding-right: 2px; padding-left: 2px;">
          <span style="font-size: 24px;">{{getDifferenceInMinutes()}} h</span>
        </div>
      </div>
    </div>

    <div style="flex: 1; display: flex; flex-direction: row; align-items: flex-end;">
      <div style="width: 70%; padding-right: 4px; padding-left: 2px;">
        <app-form-field [type]="'autocomplete'" [label]="'Utenti'" [name]="'user'" [formField]="formGroupObj.user"[autocompleteObj]="userAutocompleteObj" style="flex: 1;"></app-form-field>
      </div>
      
      <div style="width: 30%; padding-right: 2px; padding-left: 4px; display: flex; flex-direction: column; justify-content: flex-end;">
        <div style="font-size: 12px; color: rgba(0,0,0,0.6); margin-bottom: 2px;">Furgone</div>
        <div style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 4px;">
          <mat-icon class="mdi mdi-truck" style="font-size: 18px; width: 18px; height: 18px;"
            [style.color]="id_truck ? '#388e3c' : '#f44336'"></mat-icon>
          <span style="font-size: 14px;" [style.color]="id_truck ? 'inherit' : '#f44336'">{{ truckLabel }}</span>
        </div>
        <div *ngIf="!id_truck" style="font-size: 11px; color: #f44336; margin-top: 2px;">Seleziona un furgone dalla toolbar</div>
      </div>
    </div>

    <mat-divider></mat-divider>

    <ng-container *ngIf="!serviceOperation && !serviceTask && !serviceCall && serviceTaskHintList.length>0">
      <div style="display: flex;">
        <div style="font-size: 15px; place-self: center; margin-right: 5px;">
          Recenti:
        </div>
        <div style="flex: 1;">
          <mat-chip-listbox>
            <ng-container *ngFor="let serviceTaskHint of serviceTaskHintList">
              <mat-chip-option [matTooltip]="serviceTaskHint && serviceTaskHint.job_details ? '(' + serviceTaskHint['job_details']['job']['code'] + ') ' + serviceTaskHint['job_details']['job']['consumer']['name'] + ' - ' + (serviceTaskHint.code ? serviceTaskHint.code : 'Codice non assegnato') : ''" [selected]="serviceTaskHint.id == serviceTaskHintIdSelected" (click)="serviceTaskHintClick(serviceTaskHint,serviceTaskHint.id == serviceTaskHintIdSelected)" style="cursor: pointer;">{{serviceTaskHint && serviceTaskHint.job_details && serviceTaskHint.job_details.job ? serviceTaskHint?.job_details?.job?.code : ''}}</mat-chip-option>
            </ng-container>
          </mat-chip-listbox>
        </div>
      </div>
      <mat-divider></mat-divider>
    </ng-container>

    <!-- TODO display: none -->
    <div style="flex: 1; display: none;">
      <app-form-field [type]="'autocomplete'" [label]="'Attività'" [name]="'serviceTask'" [formField]="formGroupObj.serviceTask" [autocompleteObj]="serviceTaskAutocompleteObj" style="flex: 1;"></app-form-field>
    </div>

    <!-- <mat-divider></mat-divider> -->

    <div style="flex: 1;">
      <app-form-field [type]="'radiogroup_horizontal'" [name]="'serviceOperationTypology'" [formField]="formGroupObj.serviceOperationTypology" [radioButtonList]="serviceOperationTypologyList" style="flex: 1;"></app-form-field>
    </div>

    <div class="form-field-row">
      <app-form-field [type]="'autocomplete'" [label]="'Cliente'" [name]="'consumer'" [formField]="formGroupObj.consumer" [autocompleteObj]="consumerAutocompleteObj" style="flex: 1;"></app-form-field>
      <app-form-field [type]="'autocomplete'" [label]="'Sede'" [name]="'destination'" [formField]="formGroupObj.destination" [autocompleteObj]="destinationAutocompleteObj" style="flex: 1;"></app-form-field>
    </div>

    <div class="form-field-row">
      <app-form-field [type]="'autocomplete'" [label]="'Commessa'" [name]="'job'" [formField]="formGroupObj.job" [autocompleteObj]="jobAutocompleteObj" style="flex: 3;"></app-form-field>
      <app-form-field [type]="'autocomplete'" [label]="'Dettaglio Commessa'" [name]="'jobDetails'" [formField]="formGroupObj.jobDetails" [autocompleteObj]="jobDetailsAutocompleteObj" style="flex: 2;"></app-form-field>
    </div>

    <div style="flex: 1; margin-top: 5px; margin-bottom: 10px;">
      <app-form-field [type]="'radiogroup_horizontal'" [name]="'is_finished'" [formField]="formGroupObj.isFinished" [radioButtonList]="isFinishAnswerList" style="flex: 1"></app-form-field>
    </div>

    <div style="flex: 1;">
      <app-form-field [type]="'autocomplete'" [label]="'Macchine'" [name]="'machine'" [formField]="formGroupObj.machine" [autocompleteObj]="machineAutocompleteObj" style="flex: 1;"></app-form-field>
    </div>

    <ng-container *ngIf="serviceCall">
      <div style="display: flex; background-color: #fffddb; border: 1px solid #0000001f; border-radius: 5px; padding: 2px;">
        <mat-icon style="flex: 0; place-self: center;" class="mdi mdi-ticket-account"></mat-icon>
        <div style="font-size: 14px; place-self: center; margin-right: 5px;">
          Ticket:
        </div>
        <div style="flex: 1; font-size: 16px; place-self: center;  color: darkred;">
          <span>{{ serviceCall.description }}</span>
        </div>
      </div>
    </ng-container>

    <div style="flex: 1;">
      <app-form-field [type]="'textarea'" [label]="'Descrizione'" [name]="'description'" [formField]="formGroupObj.description" style="flex: 1;"></app-form-field>
    </div>

    <div class="form-button-group" style="flex: 1; margin-top: 15px;">
      <button mat-raised-button color="f4ns-confirm" (click)="save()" [disabled]="this.confirmClicked || !f4nsForm.valid || userAutocompleteObj.chipsObj.dataList.length === 0 || !id_truck">
        Salva
      </button>

      <button mat-raised-button color="f4ns-action" style="margin-left: 10px;" (click)="dialogRef.close()">
        Annulla
      </button>

      <ng-container *ngIf="serviceOperation">
        <button mat-raised-button color="f4ns-cancel" matTooltip="Cancella" style="float: right;" (click)="delete()" [disabled]="!serviceTaskIsEditable">
          <mat-icon class="mdi mdi-delete-forever"></mat-icon>
        </button>
      </ng-container>
    </div>
  </div>
</form>
