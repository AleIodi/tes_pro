<form #f4nsForm="ngForm" [formGroup]="formGroup">
  <div style="display: flex; flex-direction: column;">

    <div style="flex: 1; display: flex; flex-direction: row;">
      <div style="width: 50%;">
        <div style="padding-right: 2px; padding-left: 2px;">
          <app-form-field [type]="'date'" [label]="'Data Inizio'" [name]="'dateStart'" [formField]="formGroupObj.dateStart" style="flex: 1;"></app-form-field>
        </div>
      </div>

      <div style="width: 50%;">
        <div style="padding-right: 2px; padding-left: 2px;">
          <app-form-field [type]="'number'" [label]="'Durata'" [name]="'hours'" [formField]="formGroupObj.hours" style="flex: 1;"></app-form-field>
        </div>
      </div>
    </div>

    <mat-divider></mat-divider>

    <div style="flex: 1;">
      <app-form-field [type]="'radiogroup_horizontal'" [name]="'serviceOperationTypology'" [formField]="formGroupObj.serviceOperationTypology" [radioButtonList]="serviceOperationTypologyList" style="flex: 1;"></app-form-field>
    </div>

    <div style="flex: 1;">
      <app-form-field [type]="'autocomplete'" [label]="'Cliente'" [name]="'consumer'" [formField]="formGroupObj.consumer" [autocompleteObj]="consumerAutocompleteObj" style="flex: 1;"></app-form-field>
    </div>

    <div style="flex: 1;">
      <app-form-field [type]="'autocomplete'" [label]="'Commessa'" [name]="'job'" [formField]="formGroupObj.job" [autocompleteObj]="jobAutocompleteObj" style="flex: 1;"></app-form-field>
    </div>

    <div style="flex: 1;">
      <app-form-field [type]="'autocomplete'" [label]="'Dettaglio Commessa'" [name]="'jobDetails'" [formField]="formGroupObj.jobDetails" [autocompleteObj]="jobDetailsAutocompleteObj" style="flex: 1;"></app-form-field>
    </div>

    <mat-divider></mat-divider>

    <div style="flex: 1;">
      <app-form-field [type]="'textarea'" [label]="'Descrizione'" [name]="'description'" [formField]="formGroupObj.description" style="flex: 1;"></app-form-field>
    </div>

    <div class="form-button-group" style="flex: 1;">
      <button mat-raised-button color="f4ns-confirm" (click)="save()" [disabled]="this.confirmClicked || !f4nsForm.valid">
        Salva
      </button>

      <button mat-raised-button color="f4ns-action" style="margin-left: 10px;" (click)="dialogRef.close()">
        Annulla
      </button>

      <ng-container *ngIf="serviceOperation">
        <button mat-raised-button color="f4ns-cancel" matTooltip="Cancella" style="float: right;" (click)="delete()">
          <mat-icon class="mdi mdi-delete-forever"></mat-icon>
        </button>
      </ng-container>
    </div>
  </div>
</form>
