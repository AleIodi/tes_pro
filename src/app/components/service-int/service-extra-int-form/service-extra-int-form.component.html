<form #f4nsForm="ngForm" [formGroup]="formGroup">
  <div style="display: flex; flex-direction: column;">
    <div style="flex: 1; display: flex; flex-direction: row;">
      <div style="width: 100%;">
        <div style="padding-right: 2px; padding-left: 2px;">
          <app-form-field [type]="'date'" [label]="'Data'" [name]="'dateStart'" [formField]="formGroupObj.dateStart" style="flex: 1;"></app-form-field>
        </div>
      </div>
    </div>

    <mat-divider></mat-divider>

    <div style="flex: 1;">
      <mat-chip-listbox>
        <ng-container *ngFor="let jobHint of jobHintList">
          <mat-chip-option [matTooltip]="jobHint.name" [selected]="jobHint.code == jobHintCodeSelected" (click)="jobHintClick(jobHint)" style="cursor: pointer;">{{jobHint.code}}</mat-chip-option>
        </ng-container>
      </mat-chip-listbox>
      <br />
    </div>

    <div style="flex: 1;">
      <app-form-field [type]="'autocomplete'" [label]="'Cliente'" [name]="'consumer'" [formField]="formGroupObj.consumer" [autocompleteObj]="consumerAutocompleteObj" style="flex: 1;"></app-form-field>
    </div>

    <div style="flex: 1;">
      <app-form-field [type]="'autocomplete'" [label]="'Commessa'" [name]="'job'" [formField]="formGroupObj.job" [autocompleteObj]="jobAutocompleteObj" style="flex: 1;"></app-form-field>
    </div>

    <mat-divider></mat-divider>

    <div style="flex: 1;">
      <app-form-field [type]="'autocomplete'" [label]="'Tipologia'" [name]="'serviceExtraTypology'" [formField]="formGroupObj.serviceExtraTypology" [autocompleteObj]="serviceExtraTypologyAutocompleteObj" style="flex: 1;"></app-form-field>
    </div>

    <div style="flex: 1; display: flex; flex-direction: row;">
      <app-form-field [type]="'text'" [label]="'Valore'" [name]="'value'" [formField]="formGroupObj.value" style="flex: 1;"></app-form-field>
    </div>

    <div style="flex: 1;">
      <app-form-field [type]="'textarea'" [label]="'Note'" [name]="'notes'" [formField]="formGroupObj.notes" style="flex: 1;"></app-form-field>
    </div>

    <div class="form-button-group" style="flex: 1;">
      <button mat-raised-button color="f4ns-confirm" (click)="save()" [disabled]="this.confirmClicked || !f4nsForm.valid">
        Salva
      </button>

      <button mat-raised-button color="f4ns-action" style="margin-left: 10px;" (click)="dialogRef.close()">
        Annulla
      </button>

      <ng-container *ngIf="serviceExtra">
        <button mat-raised-button color="f4ns-cancel" matTooltip="Cancella" style="float: right;" (click)="delete()">
          <mat-icon class="mdi mdi-delete-forever"></mat-icon>
        </button>
      </ng-container>
    </div>
  </div>
</form>
