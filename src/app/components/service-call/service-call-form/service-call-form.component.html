<form #f4nsForm="ngForm" [formGroup]="formGroup">
  <div style="display: flex; flex-direction: column;">

    <div style="display: flex; flex-direction: column;" [style.display]="isTicketSchedulationMode ? 'inherit' : 'none'">
      <div style="flex: 1; display: flex; flex-direction: row;">
        <div style="width: 30%;">
          <div style="padding-right: 2px; padding-left: 2px;">
            <app-form-field [type]="'date'" [label]="'Data Inizio'" [name]="'dateStart'" [formField]="formGroupObj.dateStart" style="flex: 1;"></app-form-field>
          </div>
        </div>

        <div style="width: 20%;">
          <div style="padding-right: 2px; padding-left: 2px;">
            <app-form-field [type]="'time'" [label]="'Ora Inizio'" [name]="'timeStart'" [formField]="formGroupObj.timeStart" (focusout)="fixStartEndTime(true)" style="flex: 1;"></app-form-field>
          </div>
        </div>

        <div style="width: 20%;">
          <div style="padding-right: 2px; padding-left: 2px;">
            <app-form-field [type]="'time'" [label]="'Ora Fine'" [name]="'timeEnd'" [formField]="formGroupObj.timeEnd" (focusout)="fixStartEndTime(false)" style="flex: 1;"></app-form-field>
          </div>
        </div>

        <div style="width: 30%; display: flex; justify-content: center; align-items: center;">
          <div style="padding-right: 2px; padding-left: 2px;">
            <span style="font-size: 24px;">{{getDifferenceInMinutes()}} h</span>
          </div>
        </div>
      </div>

      <div style="flex: 1;">
        <app-form-field [type]="'autocomplete'" [label]="'Utenti'" [name]="'user'" [formField]="formGroupObj.user" [autocompleteObj]="userAutocompleteObj" style="flex: 1;"></app-form-field>
      </div>

      <mat-divider></mat-divider>
    </div>

    <div class="form-field-row">
      <app-form-field [type]="'autocomplete'" [label]="'Cliente'" [name]="'consumer'" [formField]="formGroupObj.consumer" [autocompleteObj]="consumerAutocompleteObj" style="flex: 1;"></app-form-field>
      <app-form-field [type]="'autocomplete'" [label]="'Sede'" [name]="'destination'" [formField]="formGroupObj.destination" [autocompleteObj]="destinationAutocompleteObj" style="flex: 1;"></app-form-field>
    </div>

    <div class="form-field-row">
      <app-form-field [type]="'autocomplete'" [label]="'Commessa'" [name]="'job'" [formField]="formGroupObj.job" [autocompleteObj]="jobAutocompleteObj" style="flex: 3;"></app-form-field>
      <app-form-field [type]="'autocomplete'" [label]="'Dettaglio Commessa'" [name]="'jobDetails'" [formField]="formGroupObj.jobDetails" [autocompleteObj]="jobDetailsAutocompleteObj" style="flex: 2;"></app-form-field>
    </div>

    <div style="flex: 1;" [style.display]="!isTicketSchedulationMode ? 'inherit' : 'none'">
      <app-form-field [type]="'autocomplete'" [label]="'Contatto'" [name]="'contact'" [formField]="formGroupObj.contact" [autocompleteObj]="contactAutocompleteObj" style="flex: 2;"></app-form-field>
    </div>

    <div style="flex: 1;">
      <app-form-field [type]="'autocomplete'" [label]="'Macchine'" [name]="'machine'" [formField]="formGroupObj.machine" [autocompleteObj]="machineAutocompleteObj" style="flex: 1;"></app-form-field>
    </div>

    <div style="flex: 1;">
      <app-form-field [type]="'textarea'" [label]="'Descrizione'" [name]="'description'" [formField]="formGroupObj.description" style="flex: 1;"></app-form-field>
    </div>

    <div class="form-button-group" style="flex: 1; margin-top: 15px;">
      <button mat-raised-button color="f4ns-confirm" (click)="save()" [disabled]="this.confirmClicked || !f4nsForm.valid || (isTicketSchedulationMode && userAutocompleteObj.chipsObj.dataList.length === 0)">
        Salva
      </button>

      <button mat-raised-button color="f4ns-action" style="margin-left: 10px;" (click)="dialogRef.close()">
        Annulla
      </button>

      <ng-container *ngIf="serviceCall">
        <button mat-raised-button color="f4ns-cancel" matTooltip="Cancella" style="float: right;" (click)="delete()" [disabled]="!serviceCallIsEditable">
          <mat-icon class="mdi mdi-delete-forever"></mat-icon>
        </button>
      </ng-container>
    </div>
  </div>
</form>
